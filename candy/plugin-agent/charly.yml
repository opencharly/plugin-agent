plugin-agent:
    candy:
        description: |-
            Headless, daemon-free agent control plugin owning CUE-validated agent and
            agent-team kinds plus reflected `charly agent`, `charly tui`, and
            compatibility `charly tmux` commands. It persists sessions, runs, ordered
            evidence, incidents, RCA, and recovery decisions while routing every runtime
            and terminal operation through generic Provider.Channel target data. The
            tmux compatibility surface is a typed facade and never constructs remote
            tmux shell strings or accesses an operator tmux socket.
        plugin:
            source: github.com/opencharly/plugin-agent/candy/plugin-agent
            providers:
                - kind:agent
                - kind:agent-team
                - command:agent
                - command:tui
                - command:tmux
        plan:
            - check: the headless typed agent command tree is present in the compiled Charly binary
              id: agent-control-cli-present
              context: [runtime]
              command: charly agent runtime list
              exit_status: 0
            - check: the legacy tmux command grammar is preserved as a typed-provider compatibility facade
              id: typed-tmux-compatibility-present
              context: [runtime]
              command: charly tmux list --help
              exit_status: 0
              stdout:
                - contains: List compatibility tmux sessions

tui-skill:
    skill:
        name: tui
        family: agent
        owner: plugin-agent
        triggers:
            - "`charly tui` / agent TUI / interactively browse agent sessions"

# ---------------------------------------------------------------------------
# The verb/schema skills this repo's own candy owns — routing only.
#
# Each node carries `name`/`family`/`owner` (plus `triggers:` where the skill
# generates DISPATCHER.md rows). The prose is the skill FILE at
# `<repo root>/.agents/skills/<name>/SKILL.md`, never an inline `description:`
# or `content:` — an inline body that disagrees with its file is a hard error
# in the marketplace generator. `family:` is the marketplace family the skill
# was authored under, kept so every existing `/charly-<family>:<name>` address
# still resolves; `owner:` names the candy whose command/kind surface the
# skill documents. This candy composes no image, so these nodes add nothing to
# any `ai.opencharly.skill` OCI label; the bodies reach consumers through the
# generated marketplace corpus.
# ---------------------------------------------------------------------------
agent-skill:
    skill:
        name: agent
        family: automation
        owner: plugin-agent
        triggers:
            - "`charly agent` / agent control plane / sessions / runs / terminal channels / `charly tui` / MCP routing / agent target routing"

# The one `type: agent` definition this candy's surface also owns: the operator
# that DRIVES the control plane (`charly agent`, `charly tui`, `charly tmux`,
# federation, endpoint replication, incident/RCA/recovery). Relocated by the
# skills-only carrier retirement (opencharly/opencharly#600, #628) from the
# `pod-charly-automation` carrier: its own prose opens "Use
# `/charly-automation:agent` and `/charly-automation:tmux` before acting", so the
# repo holding those two skills — this one — is where it belongs (AGENTS.md
# Part II #5). Its body is the sibling `.agents/agents/<name>.md`, the path
# `deploykit` reads for an `agent`-type node.
agent-control-operator-skill:
    skill:
        type: agent
        name: agent-control-operator
        family: automation
        owner: plugin-agent
        model: inherit
