version: 2026.232.0520
plugin-agent:
    candy:
        version: 2026.199.1330
        description: |-
            Headless, daemon-free agent control plugin owning CUE-validated agent and
            agent-team kinds plus reflected `charly agent`, `charly tui`, and
            compatibility `charly tmux` commands. It persists sessions, runs, ordered
            evidence, incidents, RCA, and recovery decisions while routing every runtime
            and terminal operation through generic Provider.Channel target data. The
            tmux compatibility surface is a typed facade and never constructs remote
            tmux shell strings or accesses an operator tmux socket.
        plugin:
            source: github.com/opencharly/plugin-agent/candy/plugin-agent
            providers:
                - kind:agent
                - kind:agent-team
                - command:agent
                - command:tui
                - command:tmux
        plan:
            - check: the headless typed agent command tree is present in the compiled Charly binary
              id: agent-control-cli-present
              context: [runtime]
              command: charly agent runtime list
              exit_status: 0
            - check: the legacy tmux command grammar is preserved as a typed-provider compatibility facade
              id: typed-tmux-compatibility-present
              context: [runtime]
              command: charly tmux list --help
              exit_status: 0
              stdout:
                - contains: List compatibility tmux sessions

tui-skill:
    skill:
        name: tui
        family: agent
        owner: plugin-agent
        description: |-
            `charly tui` — the terminal UI for the agent control plane: browse and drive agent
            sessions, runs, and terminal channels interactively.
        triggers:
            - "`charly tui` / agent TUI / interactively browse agent sessions"
        content: |
            # charly tui — the agent control-plane terminal UI

            `charly tui` opens the terminal UI for Charly's agent control plane. Served by
            `candy/plugin-agent` (`command:tui`).

            ## What it does

            Browses and drives agent sessions, runs, and terminal channels interactively — the
            visual counterpart to the `charly agent` command family. It shares the agent
            control-plane model: daemon-free sessions, runs, terminal channels, Pi
            native/orchestrator/TUI modes, and the tmux compatibility layer.

            ## When to use it

            For interactive inspection/control of agent sessions. For scripting or a single
            operation, use `charly agent` instead.

            ## Cross-References

            - `/charly-automation:agent` — the full agent control-plane surface (sessions, runs,
              terminal channels, federation, MCP routing).
            - `/charly-automation:tmux` — the typed persistent terminal sessions.
